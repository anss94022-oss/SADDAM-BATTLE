name: Project Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "4.3-stable"

jobs:
  validate:
    name: Validate Godot project
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Godot engine
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          cd "$HOME/godot"
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_RELEASE}_linux.x86_64"
          echo "GODOT_BIN=$HOME/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import project (validates every script and asset)
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --import 2>&1 | tee import.log
          if grep -q "SCRIPT ERROR" import.log; then
            echo "::error::GDScript errors detected during import."
            exit 1
          fi

      - name: Check required files exist
        run: |
          set -euo pipefail
          required=(
            "project.godot"
            "scenes/main/main.tscn"
            "scripts/main/main.gd"
            "scripts/player/player.gd"
            "scripts/ai/enemy.gd"
            "scripts/missions/mission_manager.gd"
            "data/missions/missions.json"
            "icon.png"
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "::error::missing $path"; exit 1; }
          done
          echo "all required files present"

      - name: Validate mission data
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          data = json.load(open("data/missions/missions.json"))
          campaign = data["campaign"]
          assert len(campaign) == 12, f"expected 12 missions, found {len(campaign)}"
          for m in campaign:
              for key in ("id", "name", "brief", "map", "objective", "enemy_count"):
                  assert key in m, f"mission {m.get('id')} missing {key}"
              assert m["enemy_count"] > 0
          print("missions validated:", len(campaign))
          PY

      - name: Gameplay smoke test
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script tests/gameplay/smoke_test.gd 2>&1 \
            | grep -vE "mesh_get_surface_count|Parameter \"m\" is null" | tee smoke.log
          grep -q "SMOKE OK" smoke.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            import.log
            smoke.log
          if-no-files-found: warn
          retention-days: 14
