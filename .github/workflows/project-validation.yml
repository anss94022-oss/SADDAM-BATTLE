name: Project Validation

on:
  push:
    branches: [main, rebuild/v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_RELEASE: "4.3-stable"

jobs:
  validate:
    name: Validate project and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" && cd "$HOME/godot"
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip && chmod +x "Godot_v${GODOT_RELEASE}_linux.x86_64"
          echo "GODOT_BIN=$HOME/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import project
        run: |
          "$GODOT_BIN" --headless --path . --import 2>&1 | tee import.log
          if grep -q "SCRIPT ERROR" import.log; then
            echo "::error::GDScript errors detected during import."
            exit 1
          fi

      - name: Project structure and data validation
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path . res://tests/project/check_project.tscn 2>&1 \
            | grep -vE 'mesh_get_surface_count|Parameter "m" is null' | tee project-check.log
          grep -q "PROJECT CHECK OK" project-check.log

      - name: Gameplay tests
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path . res://tests/gameplay/smoke_test.tscn 2>&1 \
            | grep -vE 'mesh_get_surface_count|Parameter "m" is null' | tee gameplay.log
          grep -q "SMOKE OK" gameplay.log
          if grep -q "  FAIL " gameplay.log; then
            echo "::error::Gameplay checks failed."
            exit 1
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            import.log
            project-check.log
            gameplay.log
          if-no-files-found: warn
          retention-days: 14
